name: Update and Build Healthy Me Beta v0.10 Source Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'HealthyMe-v0.9-SOURCE-DISCOVERY.zip'
      - '.github/workflows/UPDATE-v0.9-source-discovery.yml'

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Expand Healthy Me source overlay
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="HealthyMe-v0.9-SOURCE-DISCOVERY.zip"
          test -f "$ARCHIVE"

          rm -rf /tmp/healthy-me-source
          mkdir -p /tmp/healthy-me-source
          unzip -q -o "$ARCHIVE" -d /tmp/healthy-me-source
          cp -a /tmp/healthy-me-source/. "$GITHUB_WORKSPACE"/

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent beta signing key
        shell: bash
        env:
          HEALTHY_ME_DEBUG_KEYSTORE_B64: ${{ secrets.HEALTHY_ME_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${HEALTHY_ME_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "Missing repository secret HEALTHY_ME_DEBUG_KEYSTORE_B64"
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$HEALTHY_ME_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/healthyme-permanent.keystore"
          chmod 600 "$HOME/.android/healthyme-permanent.keystore"

          keytool -list \
            -keystore "$HOME/.android/healthyme-permanent.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          EXPECTED="$(
            keytool -list -v \
              -keystore "$HOME/.android/healthyme-permanent.keystore" \
              -storepass android \
              -alias androiddebugkey 2>/dev/null |
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' |
            head -n 1 |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )"

          test -n "$EXPECTED"
          echo "HEALTHY_ME_KEY_FP=$EXPECTED" >> "$GITHUB_ENV"
          echo "Permanent beta signing key restored."

      - name: Create Android platform shell
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            rm -rf /tmp/healthy_me_android
            flutter create \
              --platforms=android \
              --org com.rustnrum \
              --project-name healthy_me \
              --no-pub \
              /tmp/healthy_me_android
            cp -R /tmp/healthy_me_android/android ./android
          fi

          bash scripts/prepare_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Healthy Me APK
        run: flutter build apk --debug

      - name: Re-sign APK with permanent beta key
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-debug.apk"
          KEYSTORE="$HOME/.android/healthyme-permanent.keystore"

          test -f "$APK"
          test -f "$KEYSTORE"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          echo "Runner-generated APK certificate before permanent re-sign:"
          "$APKSIGNER" verify --print-certs "$APK" || true

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK"

          echo "APK re-signed with permanent Healthy Me beta key."

      - name: Verify permanent signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$OUTPUT"

          ACTUAL="$(
            printf '%s\n' "$OUTPUT" |
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f]+).*$/\1/p' |
            head -n 1 |
            tr '[:upper:]' '[:lower:]'
          )"

          EXPECTED="${HEALTHY_ME_KEY_FP:-}"

          if [ -z "$EXPECTED" ]; then
            echo "Permanent keystore fingerprint is missing."
            exit 1
          fi

          if [ -z "$ACTUAL" ]; then
            echo "Could not parse final APK certificate fingerprint."
            exit 1
          fi

          echo "Permanent keystore certificate: $EXPECTED"
          echo "Final APK certificate:          $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Final APK is not signed by the permanent beta key."
            exit 1
          fi

          echo "Permanent beta signing certificate verified."

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail

          rm -f HealthyMe-v0.9-SOURCE-DISCOVERY.zip

          rm -rf android
          git checkout -- android 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Healthy Me Beta v0.10 source hub"
            git push origin HEAD:main
          fi

      - name: Upload Healthy Me APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthyMe-Beta-v0.10-source-hub-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
