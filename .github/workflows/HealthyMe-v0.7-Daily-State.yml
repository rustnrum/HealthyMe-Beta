          HEALTHYME_V07_B64
          base64 --decode "$RUNNER_TEMP/healthyme-v07.b64" > "$RUNNER_TEMP/healthyme-v07.zip"
          unzip -tqq "$RUNNER_TEMP/healthyme-v07.zip"
          unzip -q "$RUNNER_TEMP/healthyme-v07.zip" -d "$RUNNER_TEMP/healthyme-v07"
          echo "SOURCE_DIR=$RUNNER_TEMP/healthyme-v07" >> "$GITHUB_ENV"

      - name: Generate Android shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/healthyme-android-shell"
          flutter create --platforms=android --org com.rustnrum --project-name healthy_me "$RUNNER_TEMP/healthyme-android-shell"
          rm -rf "$SOURCE_DIR/android"
          cp -R "$RUNNER_TEMP/healthyme-android-shell/android" "$SOURCE_DIR/android"
          cp "$SOURCE_DIR/tooling/android/AndroidManifest.xml" "$SOURCE_DIR/android/app/src/main/AndroidManifest.xml"
          mkdir -p "$SOURCE_DIR/android/app/src/main/kotlin/com/rustnrum/healthy_me"
          cp "$SOURCE_DIR/tooling/android/MainActivity.kt" "$SOURCE_DIR/android/app/src/main/kotlin/com/rustnrum/healthy_me/MainActivity.kt"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$SOURCE_DIR/android/app/build.gradle.kts" || true

      - name: Get dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.SOURCE_DIR }}
        run: flutter analyze

      - name: Build release APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$SOURCE_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -tqq "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthyMe-Beta-v0.7.0-APK
          path: ${{ env.SOURCE_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: HealthyMe-Beta-v0.7.0-SOURCE
          path: ${{ runner.temp }}/healthyme-v07.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tested source branch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan beta-0.7-daily-state
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$SOURCE_DIR"/. .
          rm -rf .dart_tool build android
          git add -A
          git commit -m "Healthy Me Beta v0.7 daily state"
          git push --force origin beta-0.7-daily-state
