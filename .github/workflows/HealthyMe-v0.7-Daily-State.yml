name: Build Healthy Me v0.7 Daily State Beta

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/HealthyMe-v0.7-Daily-State.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
