name: Bootstrap Healthy Me Beta v0.1 Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'HealthyMe-Beta-v0.1-GITHUB-SOURCE.zip'
      - '.github/workflows/BOOTSTRAP-v0.1-FIX.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Expand project source without touching workflows
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="HealthyMe-Beta-v0.1-GITHUB-SOURCE.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Missing $ARCHIVE"
            exit 1
          fi

          rm -rf /tmp/healthy-me-source
          mkdir -p /tmp/healthy-me-source
          unzip -q "$ARCHIVE" -d /tmp/healthy-me-source

          SOURCE="/tmp/healthy-me-source/HealthyMe-Beta-v0.1"

          # Copy the real Flutter project but deliberately skip .github.
          # GitHub Actions tokens cannot create/update workflow files here.
          shopt -s dotglob nullglob
          for item in "$SOURCE"/*; do
            name="$(basename "$item")"
            if [ "$name" = ".github" ]; then
              continue
            fi
            cp -a "$item" .
          done

          rm -f "$ARCHIVE"

      - name: Commit real project structure
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Initialize Healthy Me Beta v0.1 Flutter source"
          git push origin HEAD:main
