name: Update and Build Healthy Me Beta v0.8 Health Sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'HealthyMe-v0.8-HEALTH-SOURCES.zip'
      - '.github/workflows/UPDATE-v0.8-health-sources.yml'

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Expand v0.8 health-source update
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="HealthyMe-v0.8-HEALTH-SOURCES.zip"
          test -f "$ARCHIVE"

          rm -rf /tmp/healthy-me-v08
          mkdir -p /tmp/healthy-me-v08
          unzip -q -o "$ARCHIVE" -d /tmp/healthy-me-v08

          cp -a /tmp/healthy-me-v08/. "$GITHUB_WORKSPACE"/
          python3 scripts/health_sources_patch.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform shell
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            rm -rf /tmp/healthy_me_android
            flutter create \
              --platforms=android \
              --org com.rustnrum \
              --project-name healthy_me \
              --no-pub \
              /tmp/healthy_me_android
            cp -R /tmp/healthy_me_android/android ./android
          fi

          bash scripts/prepare_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Beta v0.8 APK
        run: flutter build apk --debug

      - name: Commit validated v0.8 source
        shell: bash
        run: |
          set -euo pipefail

          rm -f HealthyMe-v0.8-HEALTH-SOURCES.zip
          rm -f scripts/health_sources_patch.py

          rm -rf android
          git checkout -- android 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Healthy Me Beta v0.8 health sources"
            git push origin HEAD:main
          fi

      - name: Upload Beta v0.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthyMe-Beta-v0.8-health-sources-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
