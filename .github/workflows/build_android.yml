name: Build Healthy Me Beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'scripts/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'android/**'
      - '.github/workflows/build_android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform shell
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            rm -rf /tmp/healthy_me_android
            flutter create \
              --platforms=android \
              --org com.rustnrum \
              --project-name healthy_me \
              --no-pub \
              /tmp/healthy_me_android
            cp -R /tmp/healthy_me_android/android ./android
          fi

          if [ -f scripts/prepare_android.sh ]; then
            bash scripts/prepare_android.sh
          else
            if [ -f android/app/build.gradle.kts ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts || true
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthyMe-Beta-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
