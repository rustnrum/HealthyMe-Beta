name: healthy_me
description: Salus by Rust N Rum - a personal health journal and body command center.
publish_to: 'none'
version: 0.21.34+72
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  health: ^13.3.2
  permission_handler: 12.0.3
  image_picker: ^1.2.3
  crypto: ^3.0.6
  jose: ^0.3.5+2
  flutter_secure_storage: ^10.2.0
  url_launcher: ^6.3.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/hero_mountains.jpg
    - lib/assets/salus/
    - assets/protocols/
    - assets/devices/
    - assets/illustrations/
