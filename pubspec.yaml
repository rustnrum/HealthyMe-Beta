name: healthy_me
description: Healthy Me - a personal body command center.
publish_to: 'none'
version: 0.10.0+14

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  health: ^13.3.2
  permission_handler: 12.0.3
